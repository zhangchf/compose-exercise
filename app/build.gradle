plugins {
  id 'com.android.application'
  id 'kotlin-android'
  id "org.jetbrains.kotlin.kapt"
  id 'dagger.hilt.android.plugin'
  id 'com.google.devtools.ksp'
  id 'org.jetbrains.kotlin.plugin.compose'
}

android {
  namespace 'com.zcf.composeexercise'

  defaultConfig {
    applicationId "com.zcf.composeexercise"
    compileSdk 35
    minSdkVersion 24
    targetSdkVersion 35
    versionCode 1
    versionName "1.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    vectorDrawables {
      useSupportLibrary true
    }
    resourceConfigurations += ['en', 'de', 'fr', 'zh', 'b+zh+Hant']
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  // Note: It's not necessary to upgrade jvm version to 17.
  // It can also build if use Java 1.8 for sourceCompatibility and targetCompatibility, and set jvmTarget = '1.8'
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }

  buildFeatures {
    compose true
  }
  composeOptions {
    kotlinCompilerExtensionVersion '1.5.7'
  }
  kapt {
    correctErrorTypes = true
  }
}

dependencies {

  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'com.google.android.material:material:1.12.0'
  implementation "androidx.compose.ui:ui:1.7.8"
  implementation "androidx.compose.material:material:1.7.8"
  implementation "androidx.compose.ui:ui-tooling-preview:1.7.8"
  implementation 'androidx.activity:activity-compose:1.10.0'
  implementation 'androidx.fragment:fragment-ktx:1.8.6'

  // material3
  implementation "androidx.compose.material3:material3-android:1.3.1"
  implementation "androidx.compose.material3:material3-window-size-class-android:1.3.1"

  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
  implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'

  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1")

  implementation "com.google.dagger:hilt-android:2.51.1"
  kapt "com.google.dagger:hilt-compiler:2.51.1"

  implementation 'androidx.lifecycle:lifecycle-runtime-compose-android:2.8.7'
  implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

  implementation "com.squareup.retrofit2:retrofit:2.11.0"
  implementation "com.squareup.retrofit2:converter-gson:2.9.0"

  implementation "com.squareup.moshi:moshi:1.15.1"
  implementation "com.squareup.moshi:moshi-kotlin:1.15.1"
  ksp "com.squareup.moshi:moshi-kotlin-codegen:1.14.0"

  // For Test RxJava
  implementation 'io.reactivex.rxjava3:rxjava:3.1.3'
  implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'

  implementation "androidx.navigation:navigation-compose:2.8.7"

//  implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.4.0-rc01"

  implementation 'dnsjava:dnsjava:3.5.2'
  implementation 'org.minidns:minidns-hla:1.0.5'

  implementation "androidx.camera:camera-camera2:1.4.1"
  implementation "androidx.camera:camera-lifecycle:1.4.1"
  implementation "androidx.camera:camera-view:1.4.1"
  implementation "com.google.mlkit:barcode-scanning:17.3.0"

  implementation "io.coil-kt:coil-compose:2.6.0"
  implementation "io.coil-kt:coil-gif:2.6.0"

  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test.ext:junit-ktx:1.2.1'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
  androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.7.8"
  debugImplementation "androidx.compose.ui:ui-tooling:1.7.8"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1"

  lintChecks project(":lint-rules")
}